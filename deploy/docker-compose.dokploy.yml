# Compose para deploy via DOKPLOY.
#
# Diferenças em relação ao docker-compose.yml (standalone):
#   - SEM Caddy: o Dokploy/Traefik já cuida de proxy e HTTPS. Rodar Caddy aqui
#     brigaria pelas portas 80/443.
#   - Enquanto não há domínio, o painel é publicado numa porta do host (8090) para
#     acesso por IP:  http://IP_DA_VPS:8090
#   - VNC do MT5 vai para a porta 3100 do host (a 3000 é usada pelo próprio Dokploy).
#   - Variáveis vêm do ambiente do Dokploy (aba Environment do serviço).
#
# No Dokploy: crie um serviço do tipo "Compose", aponte para este arquivo
# (Compose Path: deploy/docker-compose.dokploy.yml) e cole as variáveis no Environment.
#
# 26/10 — OTIMIZAÇÃO DE RECURSOS (a VPS estourou rodando tudo junto):
#   - RODA SÓ FOREX. Os 4 serviços da B3 (mt5_b3/coletor_b3/estrategista_b3/executor_b3)
#     ficam no profile `b3` → NÃO sobem por padrão (tiram o 2º terminal MT5/Wine = metade
#     do peso). Religar a B3 = subir com o profile `b3` (no Dokploy, Compose Profiles: b3)
#     + `B3_HABILITADO=true`/`B3_SOMBRA_HABILITADA=true` no Environment.
#   - ROTAÇÃO DE LOG em todo serviço (json-file 10m×3) → os logs do Docker nunca mais
#     enchem o disco (era a causa nº 1 de encher: DEBUG sem rotação).
#   - TETO DE MEMÓRIA por serviço (mem_limit) → um pico (ex.: Wine) não derruba o host.
#   - POLLS mais folgados por padrão (menos marteladas no MT5/banco): ver os `:-N` abaixo.

# Rotação de log padrão (anexada em todos os serviços via `logging: *logrotate`).
x-logrotate: &logrotate
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ------------------------------------------------------------------ MT5 (Wine)
  mt5:
    # Imagem base gmag11 + correção do servidor da ponte (issue #28): fixa mt5linux 0.1.9.
    build:
      context: ./mt5
    image: forex_mt5:latest
    environment:
      CUSTOM_USER: ${VNC_USER:-trader}
      PASSWORD: ${VNC_PASSWORD:?defina VNC_PASSWORD no Environment}
    volumes:
      - mt5_config:/config
    ports:
      # Terminal MT5 no navegador, acessível direto pelo IP: http://IP_DA_VPS:3100
      # (protegido pela senha do VNC — CUSTOM_USER/PASSWORD). 3100 no host para não
      # colidir com o Dokploy (que usa a 3000). Depois de logar e validar, dá para
      # voltar a "127.0.0.1:3100:3000" e acessar só por túnel SSH, se quiser mais segurança.
      - "3100:3000"
    expose:
      - "8001"                       # API Python: apenas na rede interna
    networks: [interna]
    restart: unless-stopped
    logging: *logrotate
    mem_limit: ${MT5_MEM:-2g}        # terminal Wine/MT5 — o mais pesado; teto generoso

  # ------------------------------------------------------------------ Coletor (Fase 1)
  coletor:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: forex_sistema:latest
    command: python -m sistema_forex.coletor_mt5
    environment:
      MT5_HOST: mt5
      MT5_PORT: "8001"
      DADOS_DIR: /dados
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      COLETOR_POLL_S: ${COLETOR_POLL_S:-10}
      MT5_LOGIN: ${MT5_LOGIN:-}
      MT5_SERVER: ${MT5_SERVER:-}
      MT5_PASSWORD: ${MT5_PASSWORD:-}
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
      TELEGRAM_CHAT: ${TELEGRAM_CHAT:-}
    volumes:
      - dados:/dados
    depends_on:
      - mt5
    networks: [interna]
    restart: unless-stopped
    logging: *logrotate
    mem_limit: ${PY_MEM:-512m}

  # ------------------------------------------------------ MT5 B3 (Genial — feed WIN/WDO)
  # 2º terminal MT5 (mesma imagem), logado na GENIAL via VNC (porta 3101 do host). Conta
  # REAL usada SÓ como fonte de cotações da B3 — a ponte do B3 é data-only (sem ordens).
  # 26/10: no profile `b3` → NÃO sobe por padrão (rodamos só forex). Religar: profile `b3`.
  mt5_b3:
    profiles: ["b3"]
    build:
      context: ./mt5
    image: forex_mt5:latest
    environment:
      CUSTOM_USER: ${VNC_USER:-trader}
      PASSWORD: ${VNC_PASSWORD:?defina VNC_PASSWORD no Environment}
    volumes:
      # v2: disco recriado do ZERO no deploy (14/07) — o /config antigo tinha a senha VNC
      # velha gravada e recusava o login no :3101. Trocar o nome força um volume novo e vazio,
      # que re-inicializa com o VNC_PASSWORD atual. (Depois é só relogar na Genial pela tela.)
      - mt5_b3_config_v2:/config
    ports:
      # Terminal Genial no navegador: http://IP_DA_VPS:3101 (login VNC). Porta distinta
      # da 3100 (XM) e da 3000 (Dokploy). Logue na Genial uma vez; o volume persiste.
      - "3101:3000"
    expose:
      - "8001"                       # API Python (ponte B3): só na rede interna
    networks: [interna]
    restart: unless-stopped
    logging: *logrotate
    mem_limit: ${MT5_MEM:-2g}

  # ------------------------------------------------------ Coletor B3 (ETAPA 8 — WIN/WDO)
  coletor_b3:
    profiles: ["b3"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: forex_sistema:latest
    command: python -m sistema_forex.coletor_b3
    environment:
      MT5_B3_HOST: mt5_b3
      MT5_B3_PORT: "8001"
      DADOS_DIR: /dados
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      B3_HABILITADO: ${B3_HABILITADO:-false}
      PARES_B3: ${PARES_B3:-WIN$$N,WDO$$N}
      COLETOR_B3_POLL_S: ${COLETOR_B3_POLL_S:-10}
      MT5_B3_LOGIN: ${MT5_B3_LOGIN:-}
      MT5_B3_SERVER: ${MT5_B3_SERVER:-}
      MT5_B3_PASSWORD: ${MT5_B3_PASSWORD:-}
    volumes:
      - dados:/dados                 # mesmo banco: WIN/WDO viram novos `par` na tabela candles
    depends_on:
      - mt5_b3
    networks: [interna]
    restart: unless-stopped
    logging: *logrotate
    mem_limit: ${PY_MEM:-512m}

  # ------------------------------------------------------------------ Motor de análise (Fase 2)
  motor:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: forex_sistema:latest
    command: python -m sistema_forex.analise
    environment:
      DADOS_DIR: /dados
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      ANALISE_POLL_S: ${ANALISE_POLL_S:-30}
    volumes:
      - dados:/dados          # lê os candles do coletor e grava níveis/estrutura/regime
    depends_on:
      - coletor
    networks: [interna]
    restart: unless-stopped
    logging: *logrotate
    mem_limit: ${PY_MEM:-512m}

  # ------------------------------------------------------------------ Estrategista (Fase 4 — sombra)
  estrategista:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: forex_sistema:latest
    command: python -m sistema_forex.decisao
    environment:
      DADOS_DIR: /dados
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      DECISAO_POLL_S: ${DECISAO_POLL_S:-10}
    volumes:
      - dados:/dados          # lê análise/candles e grava as decisões (modo sombra, sem ordens)
    depends_on:
      - motor
    networks: [interna]
    restart: unless-stopped
    logging: *logrotate
    mem_limit: ${PY_MEM:-512m}

  # ------------------------------------------------------------------ Executor + gestor (Fase 5)
  executor:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: forex_sistema:latest
    command: python -m sistema_forex.executor
    environment:
      MT5_HOST: mt5
      MT5_PORT: "8001"
      DADOS_DIR: /dados
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      # TRAVA: false = simulação sobre preço ao vivo (sem ordens). true = opera na demo.
      EXECUCAO_ATIVA: ${EXECUCAO_ATIVA:-false}
      GESTOR_POLL_S: ${GESTOR_POLL_S:-3}
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
      TELEGRAM_CHAT: ${TELEGRAM_CHAT:-}
    volumes:
      - dados:/dados
    depends_on:
      - estrategista
    networks: [interna]
    restart: unless-stopped
    logging: *logrotate
    mem_limit: ${PY_MEM:-512m}

  # ------------------------------------------------------ Estrategista B3 (ETAPA 8b — sombra WIN/WDO)
  # 26/10: no profile `b3` → NÃO sobe por padrão (rodamos só forex).
  estrategista_b3:
    profiles: ["b3"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: forex_sistema:latest
    command: python -m sistema_forex.decisao_b3
    environment:
      DADOS_DIR: /dados
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      B3_HABILITADO: ${B3_HABILITADO:-false}
      B3_SOMBRA_HABILITADA: ${B3_SOMBRA_HABILITADA:-false}
      PARES_B3: ${PARES_B3:-WIN$$N,WDO$$N}
      TFS_OPERACAO_B3: ${TFS_OPERACAO_B3:-M1,M5,M15}
      DECISAO_B3_POLL_S: ${DECISAO_B3_POLL_S:-10}
    volumes:
      - dados:/dados          # lê análise/candles da B3 e grava decisões (sombra, sem ordens)
    depends_on:
      - motor
    networks: [interna]
    restart: unless-stopped
    logging: *logrotate
    mem_limit: ${PY_MEM:-512m}

  # ------------------------------------------------------ Executor B3 (ETAPA 8b — sombra WIN/WDO)
  # 26/10: no profile `b3` → NÃO sobe por padrão (rodamos só forex).
  executor_b3:
    profiles: ["b3"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: forex_sistema:latest
    command: python -m sistema_forex.executor_b3
    environment:
      MT5_B3_HOST: mt5_b3
      MT5_B3_PORT: "8001"
      DADOS_DIR: /dados
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      B3_HABILITADO: ${B3_HABILITADO:-false}
      B3_SOMBRA_HABILITADA: ${B3_SOMBRA_HABILITADA:-false}
      PARES_B3: ${PARES_B3:-WIN$$N,WDO$$N}
      TFS_OPERACAO_B3: ${TFS_OPERACAO_B3:-M1,M5,M15}
      CONTRATOS_B3: ${CONTRATOS_B3:-1}
      GESTOR_B3_POLL_S: ${GESTOR_B3_POLL_S:-3}
    volumes:
      - dados:/dados
    depends_on:
      - estrategista_b3
      - mt5_b3
    networks: [interna]
    restart: unless-stopped
    logging: *logrotate
    mem_limit: ${PY_MEM:-512m}

  # ------------------------------------------------------------------ Painel web
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: forex_sistema:latest
    command: uvicorn sistema_forex.web.app:app --host 0.0.0.0 --port 8000
    environment:
      DADOS_DIR: /dados
      PAINEL_USUARIO: ${PAINEL_USUARIO:-admin}
      PAINEL_SENHA: ${PAINEL_SENHA:-}
      PAINEL_SENHA_HASH: ${PAINEL_SENHA_HASH:-}
      SECRET_KEY: ${SECRET_KEY:?defina SECRET_KEY no Environment}
      SESSAO_HORAS: ${SESSAO_HORAS:-12}
      PAINEL_REFRESH_S: ${PAINEL_REFRESH_S:-10}
      EXECUCAO_ATIVA: ${EXECUCAO_ATIVA:-false}   # só para o painel exibir o selo correto
    volumes:
      - dados:/dados
    ports:
      # Acesso por IP enquanto não há domínio. Depois, mapeie um domínio no Dokploy
      # (aba Domains → porta interna 8000) e pode remover esta publicação.
      - "8090:8000"
    depends_on:
      - coletor
    networks: [interna]
    restart: unless-stopped
    logging: *logrotate
    mem_limit: ${WEB_MEM:-512m}

networks:
  interna: {}

volumes:
  dados: {}
  mt5_config: {}
  mt5_b3_config_v2: {}
